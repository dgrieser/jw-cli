name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: v1.2.3 + 1.2 + latest on releases, edge + the commit SHA on main.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A release is deployed by asking mittwald to pull the new image. The
      # URL lives in the repository secret MITTWALD_TRIGGER_URL, since it
      # carries what authorizes the deployment; until it is set the step says
      # so and passes. The URL is only ever handed to curl through the
      # environment, never printed, and GitHub masks it in the log.
      - name: Trigger mittwald deployment
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MITTWALD_TRIGGER_URL: ${{ secrets.MITTWALD_TRIGGER_URL }}
        run: |
          if [ -z "$MITTWALD_TRIGGER_URL" ]; then
            echo "::notice::MITTWALD_TRIGGER_URL is not set; skipping the deployment trigger"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            --output /dev/null --write-out "deployment trigger answered HTTP %{http_code}\n" \
            "$MITTWALD_TRIGGER_URL"
