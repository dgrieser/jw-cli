{{define "content"}}
<div class="auth">
<h1>{{.Title}}</h1>
{{- if .Token}}
<p class="hint">{{.Notice}}</p>
<form class="auth-form" method="post" action="/account/password">
  <input type="hidden" name="token" value="{{.Token}}">
  <input type="email" name="email" value="{{.Email}}" autocomplete="username" hidden readonly>
  <label class="field"><span>{{.A.PasswordNew}}</span>
    <input type="password" name="password" autocomplete="new-password" minlength="{{.MinPassword}}" required data-autofocus>
    <small class="hint">{{printf .A.PasswordHint .MinPassword}}</small></label>
  <label class="field"><span>{{.A.PasswordRepeat}}</span>
    <input type="password" name="password2" autocomplete="new-password" minlength="{{.MinPassword}}" required></label>
  <button type="submit" class="primary">{{.A.Save}}</button>
</form>
{{- else}}
{{template "notice" .}}
{{- end}}
<p class="auth-links"><a href="/login">{{.A.BackToSignIn}}</a></p>
</div>
{{end}}
