{{define "content"}}
{{- if not .Target}}
<h1>{{.T.UIRead}}</h1>
<form class="form" method="get" action="/article">
  {{- if .Lang}}<input type="hidden" name="lang" value="{{.Lang}}">{{end}}
  <div class="query">
    <input type="text" name="target" placeholder="{{.T.UIArticleHint}}" aria-label="{{.T.UIRead}}" data-autofocus autocapitalize="off">
    <button type="submit" class="primary">{{.T.UIRead}}</button>
  </div>
</form>
{{- else}}
{{- if .Crumbs}}{{template "crumbs" .}}{{end}}
{{template "unfold" .}}
<article class="document" data-unfold="refs" data-level="{{.Unfold}}"{{if .AutoUnfold}} data-auto="{{.AutoUnfold}}"{{end}}{{if .DocID}} data-doc="{{.DocID}}"{{end}}>
{{- if .Heading}}<h1>{{.Heading}}</h1>{{end}}
{{.Body}}
</article>

{{- template "extras" .}}

{{- end}}
{{end}}
