{{define "content"}}
<h1>{{.T.UINavSearch}}</h1>
<form class="form" method="get" action="/search" role="search">
  {{- if .Lang}}<input type="hidden" name="lang" value="{{.Lang}}">{{end}}
  <div class="query">
    <input type="search" name="q" value="{{.Query}}" placeholder="{{.T.UISearchHint}}" aria-label="{{.T.UINavSearch}}" data-autofocus>
    <button type="button" class="search-opts" hidden aria-haspopup="dialog" title="{{.T.UISearchOptions}}" aria-label="{{.T.UISearchOptions}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></svg></button>
    <button type="submit" class="primary">{{.T.UINavSearch}}</button>
  </div>
  <fieldset class="options">
    <legend>{{.T.UISearchOptions}}</legend>
    <label class="opt"><span class="name">{{.T.UIEngine}}</span>
      <select name="engine">
        <option value="jworg" {{if eq .Engine "jworg"}}selected{{end}}>jw.org</option>
        <option value="wol" {{if eq .Engine "wol"}}selected{{end}}>{{.T.UISearchWOL}}</option>
      </select>
    </label>
    <label class="opt" data-engine="jworg"><span class="name">{{.T.UISearchContent}}<small>{{.T.UISearchJWOrgOnly}}</small></span>
      <select name="type">
        <option value="all" {{if eq .Type "all"}}selected{{end}}>{{.T.UISearchAll}}</option>
        <option value="publications" {{if eq .Type "publications"}}selected{{end}}>{{.T.UISearchPubs}}</option>
        <option value="videos" {{if eq .Type "videos"}}selected{{end}}>{{.T.UISearchVideos}}</option>
        <option value="audio" {{if eq .Type "audio"}}selected{{end}}>{{.T.UISearchAudio}}</option>
        <option value="bible" {{if eq .Type "bible"}}selected{{end}}>{{.T.UISearchBible}}</option>
        <option value="indexes" {{if eq .Type "indexes"}}selected{{end}}>{{.T.UISearchIndexes}}</option>
      </select>
    </label>
    <label class="opt"><span class="name">{{.T.UISort}}</span>
      <select name="sort">
        <option value="rel" {{if or (eq .Sort "rel") (eq .Sort "occ")}}selected{{end}}>{{.T.UISortRelevance}}</option>
        <option value="newest" {{if eq .Sort "newest"}}selected{{end}}>{{.T.UISortNewest}}</option>
        <option value="oldest" {{if eq .Sort "oldest"}}selected{{end}}>{{.T.UISortOldest}}</option>
      </select>
    </label>
    <label class="opt check" data-engine="wol"><input type="hidden" name="excerpts" value="false"><input type="checkbox" name="excerpts" value="true" {{if .Excerpts}}checked{{end}}><span class="name">{{.T.UIFullExcerpts}}<small>{{.T.UISearchWOLOnly}}</small></span></label>
    <label class="opt" data-engine="wol"><span class="name">{{.T.UIScope}}<small>{{.T.UISearchWOLOnly}}</small></span>
      <select name="scope">
        <option value="par" {{if ne .Scope "sen"}}selected{{end}}>{{.T.UIScopePar}}</option>
        <option value="sen" {{if eq .Scope "sen"}}selected{{end}}>{{.T.UIScopeSen}}</option>
      </select>
    </label>
    <label class="opt check" data-engine="wol"><input type="hidden" name="all" value="false"><input type="checkbox" name="all" value="true" {{if .AllCats}}checked{{end}}><span class="name">{{.T.UICatsAll}}<small>{{.T.UISearchWOLOnly}}</small></span></label>
    <label class="opt" data-engine="wol"><span class="name">{{.T.UICatsInclude}}<small>{{.T.UICatsHint}}</small></span>
      <input type="text" name="include" value="{{.Include}}" autocapitalize="off" autocomplete="off" spellcheck="false">
    </label>
    <label class="opt" data-engine="wol"><span class="name">{{.T.UICatsExclude}}<small>{{.T.UICatsHint}}</small></span>
      <input type="text" name="exclude" value="{{.Exclude}}" autocapitalize="off" autocomplete="off" spellcheck="false">
    </label>
    <label class="opt" data-engine="jworg"><span class="name">{{.T.UIPageSize}}<small>{{.T.UISearchJWOrgOnly}}</small></span>
      <input type="number" name="limit" value="{{.Limit}}" min="1" max="{{.MaxLimit}}" inputmode="numeric">
    </label>
  </fieldset>
</form>

{{- if .Header}}
<h2 class="listheader">{{.Header}}</h2>
{{template "listing" .}}
{{- range .Notes}}
<p class="note">{{.}}</p>
{{- end}}
<nav class="pager">
  {{if .PrevURL}}<a class="btn" href="{{.PrevURL}}">{{.T.UIPrevPage}}</a>{{else}}<span></span>{{end}}
  {{if .NextURL}}<a class="btn" href="{{.NextURL}}">{{.T.UINextPage}}</a>{{end}}
</nav>
{{- end}}
{{end}}
