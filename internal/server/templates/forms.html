{{define "notice"}}
{{- if .Notice}}<p class="auth-ok" role="status">{{.Notice}}</p>{{end}}
{{- end}}

{{define "settingtabs"}}
<nav class="tabs" aria-label="{{.T.UISettings}}">
  <a href="/account" {{if eq .Path "/account"}}class="active" aria-current="page"{{end}}>{{.A.Account}}</a>
  <a href="/account/keys" {{if eq .Path "/account/keys"}}class="active" aria-current="page"{{end}}>{{.A.APIKeys}}</a>
  {{- if .Admin}}
  <a href="/admin/users" {{if eq .Path "/admin/users"}}class="active" aria-current="page"{{end}}>{{.A.Users}}</a>
  <a href="/admin/settings" {{if eq .Path "/admin/settings"}}class="active" aria-current="page"{{end}}>{{.A.ServerSettings}}</a>
  {{- end}}
</nav>
{{- end}}

{{define "serverform"}}
<fieldset class="auth-section">
  <legend>{{.A.SecAccess}}</legend>
  <label class="field"><span>{{.A.PublicURL}}</span>
    <input type="url" name="public_url" value="{{.Settings.PublicURL}}" placeholder="https://jw.example.org" autocomplete="off" spellcheck="false">
    <small class="hint">{{.A.PublicURLHint}}</small></label>
  <div class="field" role="radiogroup" aria-label="{{.A.Registration}}"><span>{{.A.Registration}}</span>
    <label class="check"><input type="radio" name="registration" value="closed" {{if eq .Settings.Registration "closed"}}checked{{end}}> {{.A.RegClosed}}</label>
    <label class="check"><input type="radio" name="registration" value="approval" {{if eq .Settings.Registration "approval"}}checked{{end}}> {{.A.RegApproval}}</label>
    <label class="check"><input type="radio" name="registration" value="open" {{if eq .Settings.Registration "open"}}checked{{end}}> {{.A.RegOpen}}</label>
  </div>
  <label class="check field-check"><input type="checkbox" name="anonymous" {{if .Settings.Anonymous}}checked{{end}}> <span>{{.A.Anonymous}}<small class="hint">{{.A.AnonymousHint}}</small></span></label>
</fieldset>
<fieldset class="auth-section">
  <legend>{{.A.SecMail}}</legend>
  <p class="hint">{{.A.MailHint}}</p>
  <label class="field"><span>{{.A.SMTPHost}}</span>
    <input name="smtp_host" value="{{.Settings.SMTP.Host}}" placeholder="smtp.example.org" autocomplete="off" spellcheck="false"></label>
  <div class="field-row">
    <label class="field grow"><span>{{.A.SMTPSecurity}}</span>
      <select name="smtp_security">
        <option value="starttls" data-port="587" {{if eq .Settings.SMTP.Security "starttls"}}selected{{end}}>{{.A.SecStartTLS}}</option>
        <option value="tls" data-port="465" {{if eq .Settings.SMTP.Security "tls"}}selected{{end}}>{{.A.SecTLS}}</option>
        <option value="none" data-port="25" {{if eq .Settings.SMTP.Security "none"}}selected{{end}}>{{.A.SecNone}}</option>
      </select></label>
    <label class="field"><span>{{.A.SMTPPort}}</span>
      <input name="smtp_port" type="number" min="1" max="65535" class="num" value="{{.Settings.SMTP.Port}}"></label>
  </div>
  <div class="field-row">
    <label class="field grow"><span>{{.A.SMTPUser}}</span>
      <input name="smtp_username" value="{{.Settings.SMTP.Username}}" autocomplete="off" spellcheck="false"></label>
    <label class="field grow"><span>{{.A.SMTPPassword}}</span>
      <input name="smtp_password" type="password" autocomplete="new-password" {{with .SMTPPassword}}value="{{.}}" {{end}}{{if .SMTPPasswordSet}}placeholder="••••••••"{{end}}>
      {{- if .SMTPPasswordSet}}<small class="hint">{{.A.SMTPPasswordKeep}}</small>{{end}}</label>
  </div>
  <label class="field"><span>{{.A.SMTPFrom}}</span>
    <input name="smtp_from" value="{{.Settings.SMTP.From}}" placeholder="{{.A.SMTPFromHint}}" autocomplete="off" spellcheck="false"></label>
</fieldset>
{{- end}}
