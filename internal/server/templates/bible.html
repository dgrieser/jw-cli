{{define "content"}}
<h1>{{.T.UINavBible}}</h1>
<form class="form" method="get" action="/bible">
  {{- if .Lang}}<input type="hidden" name="lang" value="{{.Lang}}">{{end}}
  <div class="query">
    <input type="text" name="ref" value="{{.Ref}}" placeholder="{{.T.UIRefHint}}" aria-label="{{.T.UINavBible}}" autofocus autocapitalize="off">
    <button type="submit" class="primary">{{.T.UIGo}}</button>
  </div>
  <select name="bible" class="edition" aria-label="{{.T.UIEdition}}">
    {{- range $e := .Editions}}
    <option value="{{$e.Symbol}}" {{if eq $.Edition $e.Symbol}}selected{{end}}>{{$e.Label}}</option>
    {{- end}}
  </select>
  {{- if or .AutoUnfold .Unfold}}<input type="hidden" name="unfold" value="{{or .AutoUnfold .Unfold}}">{{end}}
</form>

{{- if .Ref}}
{{template "unfold" .}}
<article class="document reading" data-unfold="verse" data-level="{{.Unfold}}"{{if .AutoUnfold}} data-auto="{{.AutoUnfold}}"{{end}}>
{{.Body}}
</article>
{{- end}}
{{end}}
