{{define "content"}}
<h1>{{.T.UINavMeetings}}</h1>
<form class="form" method="get" action="{{if .Part}}/meetings/{{.Part}}{{else}}/meetings{{end}}">
  {{- if .Lang}}<input type="hidden" name="lang" value="{{.Lang}}">{{end}}
  {{- if .Unfold}}<input type="hidden" name="unfold" value="{{.Unfold}}">{{end}}
  <div class="query compact">
    <input type="date" name="date" value="{{.Date}}" title="{{.T.UIDateHint}}" aria-label="{{.T.UIDateHint}}">
    <button type="submit" class="primary">{{.T.UIShow}}</button>
  </div>
</form>

<nav class="tabs" aria-label="{{.T.UINavMeetings}}">
  <a href="{{.PartURL ""}}" {{if eq .Part ""}}class="active" aria-current="page"{{end}}>{{.T.UIOverview}}</a>
  <a href="{{.PartURL "midweek"}}" {{if eq .Part "midweek"}}class="active" aria-current="page"{{end}}>{{.T.UIMidweek}}</a>
  <a href="{{.PartURL "weekend"}}" {{if eq .Part "weekend"}}class="active" aria-current="page"{{end}}>{{.T.UIWeekend}}</a>
</nav>

{{template "unfold" .}}
<article class="document">
{{- if .Heading}}<h2>{{.Heading}}</h2>{{end}}
{{.Body}}
</article>
{{- if .URL}}<p class="links"><a href="{{.URL}}" rel="noopener">{{.T.UIOpenOnSite}}</a></p>{{end}}
{{end}}
