{{define "content"}}
<h1>{{.T.UINavDailyText}}</h1>
<form class="form" method="get" action="/dailytext">
  {{- if .Lang}}<input type="hidden" name="lang" value="{{.Lang}}">{{end}}
  {{- if or .Unfold .AutoUnfold}}<input type="hidden" name="unfold" value="{{or .AutoUnfold .Unfold}}">{{end}}
  <div class="query compact">
    <input type="date" name="date" value="{{.Date}}" aria-label="{{.T.UINavDailyText}}">
    <button type="submit" class="primary">{{.T.UIShow}}</button>
  </div>
</form>

{{template "unfold" .}}
<article class="document" data-unfold="refs" data-level="{{.Unfold}}"{{if .AutoUnfold}} data-auto="{{.AutoUnfold}}"{{end}}>
{{- if .Heading}}<h2>{{.Heading}}</h2>{{end}}
{{.Body}}
</article>
{{- if .URL}}<p class="links"><a href="{{.URL}}" rel="noopener">{{.T.UIOpenOnSite}}</a></p>{{end}}
{{end}}
