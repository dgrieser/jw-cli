<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · jw</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site">
  <nav class="nav">
    <a class="brand" href="{{.WithLang "/"}}">jw</a>
    <a href="{{.WithLang "/search"}}">{{.T.UINavSearch}}</a>
    <a href="{{.WithLang "/bible"}}">{{.T.UINavBible}}</a>
    <a href="{{.WithLang "/dailytext"}}">{{.T.UINavDailyText}}</a>
    <a href="{{.WithLang "/meetings"}}">{{.T.UINavMeetings}}</a>
    <a href="{{.WithLang "/media"}}">{{.T.UINavMedia}}</a>
    <a href="{{.WithLang "/pub"}}">{{.T.UINavPublications}}</a>
    <a href="{{.WithLang "/languages"}}">{{.T.UINavLanguages}}</a>
  </nav>
  <form class="langform" method="get" action="{{.Path}}">
    {{- range .Hidden}}
    <input type="hidden" name="{{.Name}}" value="{{.Value}}">
    {{- end}}
    <label for="lang">{{.T.UILanguage}}</label>
    <input id="lang" name="lang" value="{{.Lang}}" size="6" placeholder="en" title="{{.T.UILanguageHint}}">
    <button type="submit">{{.T.UIGo}}</button>
  </form>
</header>
<main>
{{- if .Error}}
<p class="error">{{.Error}}</p>
{{- end}}
{{template "content" .}}
</main>
<footer class="site">
  <p>{{.T.UIFooter}} {{.T.UIJSONAPI}}: <a href="/api/v1/languages"><code>/api/v1</code></a></p>
</footer>
</body>
</html>
