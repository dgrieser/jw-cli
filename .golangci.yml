version: "2"

linters:
  enable:
    # Suggest modern language and library features (gopls modernize suite).
    - modernize
  settings:
    errcheck:
      # Idiomatic patterns where the error is intentionally ignored.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dgrieser/jw-cli
